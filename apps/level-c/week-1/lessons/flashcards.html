<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Week 1 Flashcards — Level C</title>
  <link rel="stylesheet" href="../../assets/navigation/gp-navigation.css?v=20260917-compact-pages&deploy=20260929-level-c-live-refresh-11">
  <link rel="stylesheet" href="../../styles.css?v=20260917-c&deploy=20260929-level-c-live-refresh-11">
  <link rel="stylesheet" href="flashcards.css?v=20260921-individual-review-v1&deploy=20260929-level-c-live-refresh-11">
</head>
<body class="flashcards-page">
  <gp-navigation data-main-href="../../index.html" data-week-href="../"></gp-navigation>
  <main class="fc-page" id="lesson-focus">
    <a class="fc-return" id="flashcards-return" href="week-1-page-01.html#lesson-focus">← Back to Literacy</a>
    <header class="fc-header">
      <h1>🃏 Week 1 Flashcards</h1>
      <p>Look, flip, and listen to every card!</p>
    </header>
    <section class="fc-board" aria-label="Week 1 flashcards">
      <div class="fc-source-tabs" role="tablist" aria-label="Choose a flashcard book">
        <button class="fc-source-tab is-active" type="button" role="tab" aria-selected="true" data-source="literacy">📘 Literacy</button>
        <button class="fc-source-tab" type="button" role="tab" aria-selected="false" data-source="speech">💬 Speech Book</button>
      </div>
      <p class="fc-source-note" id="flashcards-source-note">ELS K–8 Book • Week 1</p>
      <div class="fc-status-row">
        <span class="fc-counter" id="flashcards-counter">Card 1 of 5</span>
        <button class="fc-shuffle" id="flashcards-shuffle" type="button">🔀 Shuffle</button>
      </div>
      <div class="fc-stage">
        <div class="fc-card" id="flashcard" role="button" tabindex="0" aria-label="Flip the flashcard" aria-pressed="false">
          <div class="fc-face fc-front">
            <img id="flashcard-front-image" alt="">
            <div class="fc-image-group fc-front-group" id="flashcard-front-group" hidden></div>
            <span class="fc-page-chip" id="flashcard-page-chip"></span>
            <span class="fc-hint">👆 Tap to see the words</span>
          </div>
          <div class="fc-face fc-back">
            <img id="flashcard-back-image" alt="">
            <div class="fc-image-group fc-back-group" id="flashcard-back-group" hidden></div>
            <div class="fc-copy"><h2 id="flashcard-phrase"></h2><p id="flashcard-sentence"></p></div>
            <span class="fc-hint">👆 Tap to see the picture</span>
          </div>
        </div>
      </div>
      <div class="fc-controls" aria-label="Flashcard controls">
        <button class="fc-control fc-orange" id="flashcards-previous" type="button">← Previous</button>
        <button class="fc-control fc-blue" id="flashcards-flip" type="button">🔄 Flip</button>
        <button class="fc-control fc-green" id="flashcards-listen" type="button">🔊 Listen</button>
        <button class="fc-control fc-orange" id="flashcards-next" type="button">Next →</button>
      </div>
      <p class="fc-help" id="flashcards-help" aria-live="polite">Tap the large card to reveal the phrase and sentence.</p>
      <div class="fc-thumbnails" id="flashcards-thumbnails" aria-label="Choose a flashcard"></div>
    </section>
  </main>
  <script type="module" src="../../assets/navigation/gp-navigation.js?v=20260923-center-all-v9&deploy=20260929-level-c-live-refresh-11"></script>
  <script type="module" src="flashcards.js?v=20260922-hide-page-tags-v1&deploy=20260929-level-c-live-refresh-11"></script>
</body>
</html>
