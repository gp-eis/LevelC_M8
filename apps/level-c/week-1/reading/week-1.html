<!doctype html>
<html lang="en-US" translate="no">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Level C Week 1 Reading</title>
  <link rel="stylesheet" href="../../assets/navigation/gp-navigation.css?v=20260917-compact-pages&deploy=20260929-level-c-live-refresh-11"><link rel="stylesheet" href="../../styles.css?v=20260917-c&deploy=20260929-level-c-live-refresh-11"><link rel="stylesheet" href="../../assets/reading/reading-cover.css?v=20260928&deploy=20260929-level-c-live-refresh-11"><link rel="stylesheet" href="reading-modal.css?v=20260902-3&deploy=20260929-level-c-live-refresh-11">
<link rel="stylesheet" href="../lessons/section-polish.css?v=20260917&deploy=20260929-level-c-live-refresh-11"><script defer src="../lessons/section-polish.js?v=20260917&deploy=20260929-level-c-live-refresh-11"></script></head>
<body>
  <gp-navigation data-main-href="../../index.html" data-week-href="../" data-section-href="./week-1.html"></gp-navigation>
  <main class="track-shell" id="reading-main">
    <header class="track-heading"><span class="track-heading__icon" aria-hidden="true">📖</span><h1>Week 1 Reading</h1></header>
    <section class="media-card">
      <div class="reading-cover-card"><img src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/covers/week-1-cover.jpg" alt="Chimpanzee's Curious Eyes reading video cover"><span class="reading-cover-status">Video coming soon</span></div><h2 class="reading-book-title">Chimpanzee's Curious Eyes</h2><p class="reading-cover-note">The reading video will be added here when it is ready.</p>
      <div class="launch-row"><button class="start-btn reading-activity-open" id="reading-activity-open" type="button">Activity →</button></div>
    </section>
  </main>
  <dialog class="reading-modal" id="reading-modal" aria-labelledby="reading-modal-title">
    <div class="reading-modal__header"><div><h2 id="reading-modal-title">📖 Story Challenge</h2><p>Choose the best picture.</p></div><button class="reading-modal__close" id="reading-modal-close" type="button" aria-label="Close Reading Activity">×</button></div>
    <div class="reading-modal__body">
      <div class="reading-modal__progress"><strong id="reading-progress-label">Question 1 of 4</strong><span id="reading-progress-dots" aria-hidden="true"></span></div>
      <section class="reading-modal__question" aria-labelledby="reading-question"><div class="reading-modal__cue-slot" id="reading-cue-slot" role="img" aria-label="Question image awaiting supplied material"><span aria-hidden="true">🖼️</span><small>Question image</small></div><h3 id="reading-question"></h3></section>
      <div class="reading-modal__answers" id="reading-answers"></div>
      <p class="reading-modal__feedback" id="reading-feedback" role="status" aria-live="polite"></p>
      <button class="reading-modal__slot-next" id="reading-slot-next" type="button">Preview Question Slot 2 →</button>
      <section class="reading-modal__complete" id="reading-complete" hidden><span aria-hidden="true">🏆</span><h3>Great job!</h3><p>You finished all four questions.</p><button class="reading-modal__again" id="reading-again" type="button">Try Again</button></section>
    </div>
  </dialog>
  <script type="module" src="../../assets/navigation/gp-navigation.js?v=20260923-center-all-v9&deploy=20260929-level-c-live-refresh-11"></script><script type="module" src="reading-modal.js?v=20260902-3&deploy=20260929-level-c-live-refresh-11"></script>
</body>
</html>
