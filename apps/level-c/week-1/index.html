<html lang="en-US" translate="no">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Level C Week 1 — Animal Parts</title><link rel="stylesheet" href="../assets/navigation/gp-navigation.css?v=20260917-compact-pages&deploy=20260929-level-c-live-refresh-11"><link rel="stylesheet" href="../styles.css?v=20260917-c&deploy=20260929-level-c-live-refresh-11"><link rel="stylesheet" href="../shell-polish.css?v=20260919-level-ab-spacing-v2&deploy=20260929-level-c-live-refresh-11"></head>
<body class="week-home">
  <gp-navigation data-main-href="../index.html" data-week-href="./" data-section-href="lessons/week-1-page-01.html#lesson-focus"></gp-navigation>
  <main class="week-home-shell">
    <header class="week-heading"><h1>Week 1 — Animal Parts</h1><p>Choose a learning activity.</p></header>
    <div class="carousel-wrap">
      <button class="carousel-arrow prev" id="learning-prev" type="button" aria-label="Previous learning choice" aria-controls="learning-carousel">‹</button>
      <nav class="learning-carousel" id="learning-carousel" aria-label="Week 1 learning choices">
        <a class="learning-card literacy is-active" id="card-literacy" href="lessons/week-1-page-01.html#lesson-focus"><h2>Literacy</h2><img class="learning-card__art" src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/ui/week-home/literacy-gerry.png" width="1024" height="1536" alt="Gerry presenting an alphabet picture book"></a>
        <a class="learning-card reading" id="card-reading" href="reading/week-1.html"><h2>Reading</h2><img class="learning-card__art" src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/ui/week-home/reading-penny.png" width="1024" height="1536" loading="lazy" alt="Penny reading an illustrated storybook"></a>
        <a class="learning-card phonics" id="card-phonics" href="phonics/week-1.html"><h2>Phonics</h2><img class="learning-card__art" src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/ui/week-home/phonics-don-ay.png" width="1024" height="1536" loading="lazy" alt="Don holding lowercase phonics letters"></a>
        <a class="learning-card games" id="card-games" href="games/index.html"><h2>Games</h2><img class="learning-card__art" src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/ui/week-home/games-wanda.png" width="1024" height="1536" loading="lazy" alt="Wanda playing with a colorful game controller"></a>
      </nav>
      <button class="carousel-arrow next" id="learning-next" type="button" aria-label="Next learning choice" aria-controls="learning-carousel">›</button>
    </div>
    <div class="carousel-dots" aria-label="Learning choice position"><button class="is-active" type="button" aria-label="Show Literacy"></button><button type="button" aria-label="Show Reading"></button><button type="button" aria-label="Show Phonics"></button><button type="button" aria-label="Show Games"></button></div>
    <a class="all-weeks-btn" href="../">← All Weeks</a>
  </main>
  <script type="module" src="../assets/navigation/gp-navigation.js?v=20260923-center-all-v9&deploy=20260929-level-c-live-refresh-11"></script>
  <script>
    (() => {
      const track = document.querySelector('#learning-carousel');
      const cards = [...track.querySelectorAll('.learning-card')];
      const dots = [...document.querySelectorAll('.carousel-dots button')];
      const previous = document.querySelector('#learning-prev');
      const next = document.querySelector('#learning-next');
      let active = 0;
      let scrollFrame = 0;
      const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      const syncState = index => {
        active = Math.max(0, Math.min(cards.length - 1, index));
        cards.forEach((card, cardIndex) => card.classList.toggle('is-active', cardIndex === active));
        dots.forEach((dot, dotIndex) => dot.classList.toggle('is-active', dotIndex === active));
        previous.disabled = active === 0;
        next.disabled = active === cards.length - 1;
      };
      const show = index => {
        syncState(index);
        const card = cards[active];
        const left = card.offsetLeft - (track.clientWidth - card.offsetWidth) / 2;
        track.scrollTo({ left: Math.max(0, left), behavior: reducedMotion.matches ? 'auto' : 'smooth' });
      };
      previous.addEventListener('click', () => show(active - 1));
      next.addEventListener('click', () => show(active + 1));
      dots.forEach((dot, index) => dot.addEventListener('click', () => show(index)));
      track.addEventListener('scroll', () => {
        cancelAnimationFrame(scrollFrame);
        scrollFrame = requestAnimationFrame(() => {
          const center = track.scrollLeft + track.clientWidth / 2;
          const nearest = cards.reduce((best, card, index) => {
            const distance = Math.abs(card.offsetLeft + card.offsetWidth / 2 - center);
            return distance < best.distance ? { index, distance } : best;
          }, { index: active, distance: Infinity });
          syncState(nearest.index);
        });
      }, { passive: true });
      const restore = () => {
        const section = new URLSearchParams(location.search).get('lesson');
        const id = section ? `card-${section}` : location.hash.slice(1);
        show(Math.max(0, cards.findIndex(card => card.id === id)));
      };
      track.addEventListener('keydown', event => {
        if (!['ArrowLeft','ArrowRight'].includes(event.key)) return;
        event.preventDefault();show(active + (event.key === 'ArrowRight' ? 1 : -1));
      });
      addEventListener('load',restore,{once:true});
      addEventListener('hashchange',restore);
      addEventListener('resize',()=>show(active));
      restore();
    })();
  </script>
</body>
</html>
