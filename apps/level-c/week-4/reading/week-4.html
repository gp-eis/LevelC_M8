<script>window.M8_READING_QUIZ={questions:[
{question:'What did the black bear like to eat?',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q1.webp?asset=b34d67b21c30',choices:[{label:'Berries',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q1-a1.webp?asset=add24d7b521b'},{label:'Bamboo',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q1-a2.webp?asset=e66b5ae3bb9d'},{label:'Grass',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q1-a3.webp?asset=93f210dc519f'}],correct:0,praise:'Correct! The black bear liked to eat berries.'},
{question:'Where do bears sleep during winter?',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q2.webp?asset=3644308fe32f',choices:[{label:'In dens',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q2-a1.webp?asset=322eefb42ba3'},{label:'In bird nests',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q2-a2.webp?asset=04c30ff66401'},{label:'Underwater',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q2-a3.webp?asset=74f5bc0b0a87'}],correct:0,praise:'That’s right! Bears sleep in dens during winter.'},
{question:'What did Panda and Bear both do?',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q3.webp?asset=6c7a79b9426f',choices:[{label:'They both walked on four legs.',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q3-a1.webp?asset=56c00d9959d8'},{label:'They both flew through the sky.',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q3-a2.webp?asset=b8daa5a9ba62'},{label:'They both hopped like rabbits.',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q3-a3.webp?asset=9ca73c7841d5'}],correct:0,praise:'Correct! Panda and Bear both walked on four legs.'},
{question:'Why do many bears sleep more during winter?',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q4.webp?asset=12847b4509e5',choices:[{label:'Food is harder to find, so they save energy.',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q4-a1.webp?asset=67b26dc88179'},{label:'They are waiting for their fur to change color.',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q4-a2.webp?asset=0e8eb2591b37'},{label:'They are learning how to swim.',image:'https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-c/assets/reading/quiz/week-4/q4-a3.webp?asset=885489e93eb2'}],correct:0,praise:'Excellent! Bears sleep more because winter food is harder to find, so they save energy.'}
