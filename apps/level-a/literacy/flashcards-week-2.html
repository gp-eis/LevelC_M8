<body><gp-navigation data-main-href="../index.html" data-week-href="../week-2.html" data-section-href="week-2.html#lesson-focus" data-trail="Level A - Week 2 - Flashcards"></gp-navigation>
<nav class="literacy-tools" aria-label="Literacy"><a class="primary" href="week-2.html#lesson-focus">Literacy Home</a></nav><main class="shell flashcard-page" id="lesson-focus"><header class="hero center"><h1 class="title">Gym Flashcards</h1></header>
<div class="fc-layout"><nav class="fc-tabs" aria-label="Flashcard activities">
<button class="fc-tab is-active" type="button" data-tab="lesson" aria-pressed="true">📚 Lesson Flashcards</button><button class="fc-tab" type="button" data-tab="fast" aria-pressed="false">⚡ Fast Game</button><button class="fc-tab" type="button" data-tab="spot" aria-pressed="false">🔦 Spot the Picture</button><button class="fc-tab" type="button" data-tab="sentence" aria-pressed="false">🧩 Complete the Sentence</button></nav>
<section class="fc-workbench card"><div class="fc-panel is-active" data-panel="lesson"><button class="fc-feature" type="button" data-feature-card aria-label="View this flashcard"></button><div class="fc-thumbs" data-card-list></div></div>
<div class="fc-panel" data-panel="fast" hidden><h2>Fast Game</h2><div class="fc-fast-stage" data-fast-stage><div class="fc-curtain">?</div></div><div class="fc-controls"><button class="fc-action" type="button" data-fast-peek>Peek (0.3 sec)</button><button class="fc-action" type="button" data-fast-show>Show Full</button><button class="fc-action" type="button" data-fast-new>New Flashcard</button></div></div>
<div class="fc-panel" data-panel="spot" hidden><h2>Spot the Picture</h2><div class="fc-spot-stage" data-spot-stage tabindex="0" aria-label="Hidden flashcard. Move the spotlight to see it."></div><div class="fc-controls"><button class="fc-action" type="button" data-spot-reveal>Show Full Picture</button><button class="fc-action" type="button" data-spot-new>New Flashcard</button></div></div>
<div class="fc-panel" data-panel="sentence" hidden><h2>Complete the Sentence</h2><div class="fc-sentence">At the gym. I use <span class="fc-blank" data-sentence-blank tabindex="0">______</span>.</div><div class="fc-scatter" data-sentence-choices aria-label="Drag or tap a flashcard into the sentence"></div><p class="fc-status" data-sentence-status aria-live="polite">Drag or tap any card into the blank.</p><div class="fc-controls"><button class="fc-action" type="button" data-sentence-new>Try Again</button></div></div></section></div></main><script src="flashcards-week-2.js?v=1&deploy=20260929-level-c-live-refresh-11"></script></body></html>
