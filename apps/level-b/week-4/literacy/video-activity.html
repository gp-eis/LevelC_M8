</head>
<body>
  <gp-navigation data-main-href="../../index.html" data-week-href="../#card-literacy"
    data-previous-href="page-01.html#lesson-focus" data-next-href="page-32.html#lesson-focus"></gp-navigation>

  <main class="b-literacy b-video-activity-page">
    <section class="b-video-card" id="lesson-focus" aria-label="Why is honey good conversation videos">
      <div class="b-video-shell">
        <video id="b-week4-video" class="b-week4-video" controls playsinline preload="metadata"
          poster="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/literacy/week-4/conversation-health-3d-v1.png"
          src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-4-video/health.mp4?v=20260919-final"
          aria-label="It is good for our health video"></video>
        <button id="b-week4-play" class="b-video-play" type="button"
          aria-label="Play It is good for our health video">▶</button>
      </div>
      <p id="b-week4-now-playing" class="b-video-now-playing" aria-live="polite">It’s good for our health.</p>
    </section>

    <section class="b-video-choices" aria-label="Choose what honey is good for">
      <button class="b-video-choice is-active" type="button" aria-pressed="true" data-game="health"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-4-video/health.mp4?v=20260919-final"
        data-label="It’s good for our health.">our health</button>
      <button class="b-video-choice orange" type="button" aria-pressed="false" data-game="tummy"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-4-video/tummy.mp4?v=20260919-final"
        data-label="It’s good for my tummy.">my tummy</button>
      <button class="b-video-choice blue" type="button" aria-pressed="false" data-game="throat"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-4-video/throat.mp4?v=20260919-final"
        data-label="It’s good for my throat.">my throat</button>
      <button class="b-video-choice green" type="button" aria-pressed="false" data-game="body"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-4-video/body.mp4?v=20260919-final"
        data-label="It’s good for my body.">my body</button>
      <button class="b-video-choice purple" type="button" aria-pressed="false" data-game="skin"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-4-video/skin.mp4?v=20260919-final"
        data-label="It’s good for my skin.">my skin</button>
    </section>
  </main>

  <div class="b-activity-modal" id="b-activity-modal" hidden>
    <section class="b-activity-dialog" role="dialog" aria-modal="true" aria-labelledby="b-activity-title">
      <header class="b-activity-header">
        <div><span>Honey Helps</span><h2 id="b-activity-title"></h2></div>
        <div class="b-activity-header-actions">
          <button type="button" data-watch-video>Watch Video ▶</button>
          <button type="button" class="b-activity-close" data-close-game aria-label="Close activity">×</button>
        </div>
      </header>
      <div class="b-activity-prompt-row">
        <p class="b-activity-prompt"></p>
        <button class="b-activity-hear" type="button" data-hear-prompt aria-label="Hear the instruction">🔊</button>
      </div>
      <div class="b-activity-stage"></div>
      <p class="b-activity-status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </div>

  <div class="activity-completion-overlay" data-completion hidden role="dialog" aria-modal="true" aria-label="Activity complete">
    <div class="activity-completion-frame">
      <button class="activity-completion-close" data-close-completion type="button" aria-label="Close celebration">×</button>
      <video class="activity-completion-video" playsinline preload="metadata"
        src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/literacy/week-1/good-job.mp4" aria-label="Good job"></video>
      <p class="b-completion-sentence"></p>
      <div class="activity-completion-actions">
        <button class="activity-completion-retry" data-try-again type="button">↻ Try Again</button>
        <button class="activity-completion-retry b-completion-watch" data-watch-video type="button">Watch Video ▶</button>
      </div>
    </div>
  </div>

  <script type="module" src="lesson.js?v=20260919-week4-activities&deploy=20260929-resource-fix-2"></script>
  <script defer src="video-activity.js?v=20260919-skin-peek-v1&deploy=20260929-resource-fix-2"></script>
<script type="module" src="/LevelC_M8/apps/activity-focus.js?v=20260923-center-all-v2&deploy=20260929-resource-fix-2"></script></body>
</html>
