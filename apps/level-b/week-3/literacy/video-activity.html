<body>
  <gp-navigation data-main-href="../../index.html" data-week-href="../#card-literacy"
    data-previous-href="page-01.html#lesson-focus" data-next-href="page-22.html#lesson-focus"></gp-navigation>

  <main class="b-literacy b-video-activity-page">
    <section class="b-video-card" id="lesson-focus" aria-label="What can we make with honey conversation videos">
      <div class="b-video-shell">
        <video id="b-week3-video" class="b-week3-video" controls playsinline preload="metadata"
          poster="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/literacy/week-3/conversation-kitchen-3d-v1.png"
          src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-3-video/toast.mp4"
          aria-label="We can make honey toast video"></video>
        <button id="b-week3-play" class="b-video-play" type="button" aria-label="Play We can make honey toast video">▶</button>
      </div>
      <p id="b-week3-now-playing" class="b-video-now-playing" aria-live="polite">We can make honey toast.</p>
    </section>

    <section class="b-video-choices" aria-label="Choose a honey food video">
      <button class="b-video-choice is-active" type="button" aria-pressed="true" data-game="toast"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-3-video/toast.mp4"
        data-label="We can make honey toast.">honey toast</button>
      <button class="b-video-choice orange" type="button" aria-pressed="false" data-game="tea"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-3-video/tea.mp4"
        data-label="We can make honey tea.">honey tea</button>
      <button class="b-video-choice blue" type="button" aria-pressed="false" data-game="cake"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-3-video/cake.mp4"
        data-label="We can make honey cake.">honey cake</button>
      <button class="b-video-choice green" type="button" aria-pressed="false" data-game="pancakes"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-3-video/pancakes.mp4"
        data-label="We can make honey pancakes.">honey pancakes</button>
      <button class="b-video-choice purple" type="button" aria-pressed="false" data-game="chicken"
        data-video="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/media/literacy/week-3-video/chicken.mp4"
        data-label="We can make honey chicken.">honey chicken</button>
    </section>
  </main>

  <div class="b-activity-modal" id="b-activity-modal" hidden>
    <section class="b-activity-dialog" role="dialog" aria-modal="true" aria-labelledby="b-activity-title">
      <header class="b-activity-header">
        <div><span>Honey Kitchen</span><h2 id="b-activity-title"></h2></div>
        <div class="b-activity-header-actions">
          <button type="button" data-watch-video>Watch Video ▶</button>
          <button type="button" class="b-activity-close" data-close-game aria-label="Close activity">×</button>
        </div>
      </header>
      <div class="b-activity-prompt-row">
        <p class="b-activity-prompt"></p>
        <button class="b-activity-hear" type="button" data-hear-prompt aria-label="Hear the instruction">🔊</button>
      </div>
      <div class="b-activity-stage"></div>
      <p class="b-activity-status" aria-live="polite" aria-atomic="true"></p>
    </section>
  </div>

  <div class="activity-completion-overlay" data-completion hidden role="dialog" aria-modal="true" aria-label="Activity complete">
    <div class="activity-completion-frame">
      <button class="activity-completion-close" data-close-completion type="button" aria-label="Close celebration">×</button>
      <video class="activity-completion-video" playsinline preload="metadata"
        src="https://pub-aa69c309a877446c857c4f2564279578.r2.dev/language-m8/apps/level-b/assets/literacy/week-1/good-job.mp4" aria-label="Good job"></video>
      <p class="b-completion-sentence"></p>
      <div class="activity-completion-actions">
        <button class="activity-completion-retry" data-try-again type="button">↻ Try Again</button>
        <button class="activity-completion-retry b-completion-watch" data-watch-video type="button">Watch Video ▶</button>
      </div>
    </div>
  </div>

  <script type="module" src="lesson.js?v=20260918-activities-v1&deploy=20260929-level-c-live-refresh-11"></script>
  <script defer src="video-activity.js?v=20260919-pancake-honey-v8&deploy=20260929-level-c-live-refresh-11"></script>
